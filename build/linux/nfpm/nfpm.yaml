# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "tunnelkit"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Fortinet SSL-VPN client"
vendor: "maybk"
homepage: "https://github.com/maybk/tunnelkit"
license: "MIT"
release: "1"

contents:
  - src: "./bin/tunnelkit"
    dst: "/usr/local/bin/tunnelkit"
  - src: "./bin/tunnelkit-helper"
    dst: "/usr/local/bin/tunnelkit-helper"
  # hicolor 图标主题：scalable 覆盖任意尺寸，48 为规范最低兜底，256 供不支持 SVG 的环境；目录尺寸必须与文件实际像素一致。
  - src: "./build/linux/icons/hicolor/48x48/apps/tunnelkit.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/tunnelkit.png"
  - src: "./build/linux/icons/hicolor/256x256/apps/tunnelkit.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/tunnelkit.png"
  - src: "./build/linux/icons/hicolor/scalable/apps/tunnelkit.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/tunnelkit.svg"
  - src: "./build/linux/tunnelkit.desktop"
    dst: "/usr/share/applications/tunnelkit.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - iproute2

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - iproute

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - iproute2

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
