<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>TunnelKit 黄金圆规切线叠面盾：macOS 浅色应用图标层</title>
  <desc>面向 macOS Icon Composer 的全幅浅色应用图标层，以黄金圆规切线几何构建亮天蓝顶冠、深海蓝左护翼与右下极光翠绿大弧翼三色实心叠面盾。</desc>

  <defs>
    <!-- 纯净瓷白 -> 极浅冷灰蓝底板 -->
    <linearGradient id="background" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>

    <!-- 浅色中心环境柔光 -->
    <radialGradient id="ambient-glow" cx="512" cy="512" r="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity=".11"/>
      <stop offset="0.55" stop-color="#3B82F6" stop-opacity=".09"/>
      <stop offset="1" stop-color="#EEF4FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.11"/>
    </filter>

    <filter id="layer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>

    <linearGradient id="tk-cobalt" x1="280" y1="136" x2="840" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="tk-navy" x1="184" y1="180" x2="480" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.42" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>

    <linearGradient id="tk-emerald" x1="284" y1="860" x2="840" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="0.46" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <clipPath id="tk-clip">
      <path fill-rule="evenodd" clip-rule="evenodd"
            d="M 284 188
               C 368 184 444 164 498 140
               Q 512 134 526 140
               C 580 164 656 184 740 188
               A 100 100 0 0 1 840 288
               L 840 436
               C 840 676 624 880 512 880
               C 400 880 184 676 184 436
               L 184 288
               A 100 100 0 0 1 284 188
               Z
               M 430 356
               A 38 38 0 0 0 392 394
               L 392 436
               C 392 556 460 652 512 652
               C 564 652 632 556 632 436
               L 632 394
               A 38 38 0 0 0 594 356
               C 560 352 536 340 512 324
               C 488 340 464 352 430 356
               Z"/>
    </clipPath>
  </defs>

  <!-- 全幅浅色背景（由 macOS Icon Composer 裁切系统圆角） -->
  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="512" cy="512" r="440" fill="url(#ambient-glow)"/>

  <!-- 黄金圆规切线叠面盾主体 -->
  <g filter="url(#drop-shadow)">
    <g clip-path="url(#tk-clip)">
      <rect x="160" y="120" width="704" height="780" fill="url(#tk-cobalt)"/>

      <path d="M 326 136
               A 210 210 0 0 0 512 324
               L 512 652
               L 284 760
               L 160 760
               L 160 136 Z"
            fill="url(#tk-navy)"/>

      <path d="M 160 724
               L 284 724
               A 397 397 0 0 1 512 652
               L 580 488
               L 629 488
               A 228 228 0 0 0 840 428
               L 860 428
               L 860 900
               L 160 900 Z"
            fill="url(#tk-emerald)"
            filter="url(#layer-shadow)"/>
    </g>
  </g>
</svg>
