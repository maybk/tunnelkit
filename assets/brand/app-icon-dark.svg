<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>TunnelKit 黄金圆规切线叠面盾：深空曜石蓝深色底</title>
  <desc>TunnelKit 应用图标深色版本，1024x1024 满幅圆角无四周留白，以深空曜石蓝底衬托黄金圆规切线三色实心叠面盾。</desc>

  <defs>
    <!-- 深空曜石蓝背景 -->
    <linearGradient id="background" x1="128" y1="64" x2="896" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172844"/>
      <stop offset="0.52" stop-color="#0C1526"/>
      <stop offset="1" stop-color="#060B14"/>
    </linearGradient>

    <!-- 护盾中心环境辉光 -->
    <radialGradient id="ambient-glow" cx="512" cy="512" r="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity=".26"/>
      <stop offset="0.55" stop-color="#2563EB" stop-opacity=".20"/>
      <stop offset="1" stop-color="#060B14" stop-opacity="0"/>
    </radialGradient>

    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>

    <filter id="layer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-6" stdDeviation="10" flood-color="#020617" flood-opacity="0.32"/>
    </filter>

    <linearGradient id="tk-cobalt" x1="280" y1="136" x2="840" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset="0.45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="tk-navy" x1="184" y1="180" x2="480" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.42" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="tk-emerald" x1="284" y1="860" x2="840" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="0.46" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <clipPath id="tk-clip">
      <path fill-rule="evenodd" clip-rule="evenodd"
            d="M 284 188
               C 368 184 444 164 498 140
               Q 512 134 526 140
               C 580 164 656 184 740 188
               A 100 100 0 0 1 840 288
               L 840 436
               C 840 676 624 880 512 880
               C 400 880 184 676 184 436
               L 184 288
               A 100 100 0 0 1 284 188
               Z
               M 430 356
               A 38 38 0 0 0 392 394
               L 392 436
               C 392 556 460 652 512 652
               C 564 652 632 556 632 436
               L 632 394
               A 38 38 0 0 0 594 356
               C 560 352 536 340 512 324
               C 488 340 464 352 430 356
               Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#background)"/>
  <circle cx="512" cy="512" r="440" fill="url(#ambient-glow)"/>

  <g filter="url(#drop-shadow)">
    <g clip-path="url(#tk-clip)">
      <rect x="160" y="120" width="704" height="780" fill="url(#tk-cobalt)"/>

      <path d="M 326 136
               A 210 210 0 0 0 512 324
               L 512 652
               L 284 760
               L 160 760
               L 160 136 Z"
            fill="url(#tk-navy)"/>

      <path d="M 160 724
               L 284 724
               A 397 397 0 0 1 512 652
               L 580 488
               L 629 488
               A 228 228 0 0 0 840 428
               L 860 428
               L 860 900
               L 160 900 Z"
            fill="url(#tk-emerald)"
            filter="url(#layer-shadow)"/>
    </g>
  </g>
</svg>
