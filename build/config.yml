# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "maybk" # 开发者或组织名称
  productName: "TunnelKit" # 应用名称
  productIdentifier: "com.tunnelkit.app" # 应用唯一标识符（Bundle ID）
  description: "TunnelKit" # 应用描述（Windows PE FileDescription 进程显示名称）
  copyright: "(c) 2026, maybk" # 版权信息
  comments: "TunnelKit" # 应用备注
  version: "1.0.1" # 应用版本

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - docs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
  - name: TunnelKit
