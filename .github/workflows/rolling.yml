name: Rolling

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling
  cancel-in-progress: true

jobs:
  prepare:
    name: Select current main commit
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      build_version: ${{ steps.source.outputs.build_version }}
      app_version: ${{ steps.source.outputs.app_version }}
      rolling_version: ${{ steps.source.outputs.rolling_version }}
      should_publish: ${{ steps.source.outputs.should_publish }}
    steps:
      - name: Check out candidate source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate source commit
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = workflow_run ]; then
            source_sha="$WORKFLOW_RUN_SHA"
          else
            if [ "$EVENT_REF" != refs/heads/main ]; then
              echo "手动 Rolling 只能从 main 分支运行" >&2
              exit 1
            fi
            source_sha="$DISPATCH_SHA"
          fi

          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Rolling source must be a full commit SHA: $source_sha" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          git fetch origin --force --tags
          main_head="$(git rev-parse refs/remotes/origin/main)"
          if [ "$source_sha" != "$main_head" ]; then
            echo "目标提交已不是 origin/main HEAD，跳过过期 Rolling: $source_sha"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main; then
            echo "Rolling source must be contained in origin/main" >&2
            exit 1
          fi

          formal_tag="$(git tag --points-at "$source_sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$formal_tag" ]; then
            echo "正式发布提交，跳过 Rolling: $formal_tag"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          config_version="$(sed -n 's/^[[:space:]]*version:[[:space:]]*"\([^"]*\)".*/\1/p' build/config.yml | head -n 1)"
          if [[ ! "$config_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid application version in build/config.yml: ${config_version:-<missing>}" >&2
            exit 1
          fi
          rolling_version="$(bash scripts/extract_pending_version.sh CHANGELOG.md)"
          app_version="${rolling_version}-pre"
          build_version="${rolling_version}-pre"

          notes_error_file="$RUNNER_TEMP/pending-release-notes-error.log"
          set +e
          bash scripts/extract_release_notes.sh "$rolling_version" CHANGELOG.md \
            >/dev/null 2>"$notes_error_file"
          notes_status="$?"
          set -e
          if [ "$notes_status" -eq 2 ]; then
            rm -f "$notes_error_file"
            echo "待发布版本暂无内容，跳过 Rolling: $rolling_version"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$notes_status" -ne 0 ]; then
            cat "$notes_error_file" >&2
            exit "$notes_status"
          fi
          rm -f "$notes_error_file"

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${source_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "rolling_version=$rolling_version" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  manual-ci:
    name: Run manual Rolling CI gate
    needs: prepare
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.should_publish == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Rolling assets
    needs:
      - prepare
      - manual-ci
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.should_publish == 'true' &&
      (needs.manual-ci.result == 'success' || needs.manual-ci.result == 'skipped')
    uses: ./.github/workflows/release-assets.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.build_version }}
      retention_days: 1

  publish:
    name: Replace Rolling prerelease
    needs:
      - prepare
      - build
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.should_publish == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: rolling-release-mutation
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      ROLLING_VERSION: ${{ needs.prepare.outputs.rolling_version }}
    steps:
      - name: Check out Rolling source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Revalidate source before replacing Rolling
        id: revalidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --no-tags
          git fetch origin --force --tags

          if [ "$SOURCE_SHA" != "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo "目标提交已不是 origin/main HEAD，保留当前 Rolling"
            echo "should_replace=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          formal_tag="$(git tag --points-at "$SOURCE_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$formal_tag" ]; then
            echo "正式发布提交，跳过 Rolling: $formal_tag"
            echo "should_replace=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_replace=true" >> "$GITHUB_OUTPUT"

      - name: Download verified assets
        if: steps.revalidate.outputs.should_replace == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Validate and rename Rolling assets
        if: steps.revalidate.outputs.should_replace == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "tunnelkit-$BUILD_VERSION-macos-universal.dmg"
            "tunnelkit-$BUILD_VERSION-macos-arm64.dmg"
            "tunnelkit-$BUILD_VERSION-macos-amd64.dmg"
            "tunnelkit-$BUILD_VERSION-windows-amd64.zip"
            "tunnelkit-$BUILD_VERSION-windows-arm64.zip"
            "tunnelkit-$BUILD_VERSION-linux-amd64.tar.gz"
            "tunnelkit-$BUILD_VERSION-linux-amd64.deb"
            "tunnelkit-$BUILD_VERSION-linux-arm64.tar.gz"
            "tunnelkit-$BUILD_VERSION-linux-arm64.deb"
          )
          for asset in "${expected[@]}"; do
            test -s "release-files/$asset"
          done
          actual_count="$(find release-files -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [ "$actual_count" -ne 9 ]; then
            echo "Rolling build contains $actual_count assets; expected 9" >&2
            exit 1
          fi

          for suffix in \
            macos-universal.dmg \
            macos-arm64.dmg \
            macos-amd64.dmg \
            windows-amd64.zip \
            windows-arm64.zip \
            linux-amd64.tar.gz \
            linux-amd64.deb \
            linux-arm64.tar.gz \
            linux-arm64.deb; do
            mv "release-files/tunnelkit-$BUILD_VERSION-$suffix" \
              "release-files/tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-$suffix"
          done

          renamed=(
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-macos-universal.dmg"
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-macos-arm64.dmg"
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-macos-amd64.dmg"
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-windows-amd64.zip"
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-windows-arm64.zip"
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-linux-amd64.tar.gz"
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-linux-amd64.deb"
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-linux-arm64.tar.gz"
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-linux-arm64.deb"
          )
          for asset in "${renamed[@]}"; do
            test -s "release-files/$asset"
          done
          (
            cd release-files
            sha256sum "${renamed[@]}" > SHA256SUMS.txt
          )
          test -s release-files/SHA256SUMS.txt
          local_asset_count="$(find release-files -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [ "$local_asset_count" -ne 10 ]; then
            echo "Rolling release contains $local_asset_count local assets; expected 10" >&2
            exit 1
          fi

      - name: Prepare Rolling notes
        if: steps.revalidate.outputs.should_replace == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_notes_file="$RUNNER_TEMP/rolling-notes.md"
          pending_notes_file="$RUNNER_TEMP/rolling-changelog.md"
          bash scripts/extract_release_notes.sh "$ROLLING_VERSION" CHANGELOG.md > "$pending_notes_file"
          test -s "$pending_notes_file"
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          {
            printf '%s\n%s\n\n' '> [!WARNING]' '> 此版本为自动构建的测试版，可能不稳定，请勿用于重要环境。'
            printf '## 更新内容\n\n'
            cat "$pending_notes_file"
            printf '\n## 构建信息\n\n'
            printf -- '- 预览版本：`%s`\n' "$ROLLING_VERSION"
            printf -- '- 应用版本：`%s`\n' "$APP_VERSION"
            printf -- '- 提交：[`%s`](%s/%s/commit/%s)\n' \
              "$SHORT_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE_SHA"
            printf -- '- 构建时间：`%s`\n' "$built_at"
          } > "$release_notes_file"
          test -s "$release_notes_file"

      - name: Create draft, upload, verify, and publish Rolling
        if: steps.revalidate.outputs.should_replace == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_notes_file="$RUNNER_TEMP/rolling-notes.md"
          test -s "$release_notes_file"
          rolling_tag="v${ROLLING_VERSION}-pre"

          while IFS= read -r old_rel_tag; do
            [ -n "$old_rel_tag" ] || continue
            gh release delete "$old_rel_tag" --yes
          done < <(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName == "rolling" or (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-pre$"))) | .tagName')

          while read -r remote_sha remote_ref; do
            [ -n "$remote_ref" ] || continue
            git push \
              --force-with-lease="$remote_ref:$remote_sha" \
              origin \
              ":$remote_ref"
          done < <(git ls-remote --refs --tags origin 'refs/tags/rolling' 'refs/tags/v*-pre' || true)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a --force "$rolling_tag" -m "TunnelKit $ROLLING_VERSION Rolling ($SHORT_SHA)" "$SOURCE_SHA"
          git push origin "refs/tags/$rolling_tag"

          gh release create "$rolling_tag" \
            --verify-tag \
            --draft \
            --prerelease \
            --notes-file "$release_notes_file" \
            --title "TunnelKit $ROLLING_VERSION Rolling"

          gh release upload "$rolling_tag" release-files/*

          asset_count="$(gh release view "$rolling_tag" --json assets --jq '.assets | length')"
          if [ "$asset_count" -ne 10 ]; then
            echo "Draft Rolling release contains $asset_count assets; expected 10" >&2
            exit 1
          fi

          expected_names="$(printf '%s\n' \
            SHA256SUMS.txt \
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-linux-amd64.deb" \
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-linux-amd64.tar.gz" \
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-linux-arm64.deb" \
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-linux-arm64.tar.gz" \
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-macos-amd64.dmg" \
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-macos-arm64.dmg" \
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-macos-universal.dmg" \
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-windows-amd64.zip" \
            "tunnelkit-$ROLLING_VERSION-rolling-$SHORT_SHA-windows-arm64.zip" | sort)"
          actual_names="$(gh release view "$rolling_tag" --json assets --jq '.assets[].name' | sort)"
          if [ "$actual_names" != "$expected_names" ]; then
            echo "Draft Rolling release asset names do not match the verified local assets" >&2
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names") || true
            exit 1
          fi

          draft_state="$(gh release view "$rolling_tag" --json isDraft --jq .isDraft)"
          prerelease_state="$(gh release view "$rolling_tag" --json isPrerelease --jq .isPrerelease)"
          if [ "$draft_state" != true ] || [ "$prerelease_state" != true ]; then
            echo "Rolling must remain a draft prerelease until all assets are verified" >&2
            exit 1
          fi

          gh release edit "$rolling_tag" --draft=false --prerelease

          draft_state="$(gh release view "$rolling_tag" --json isDraft --jq .isDraft)"
          prerelease_state="$(gh release view "$rolling_tag" --json isPrerelease --jq .isPrerelease)"
          if [ "$draft_state" != false ] || [ "$prerelease_state" != true ]; then
            echo "Rolling was not published as a public prerelease" >&2
            exit 1
          fi
