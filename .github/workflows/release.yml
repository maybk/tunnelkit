name: Release

on:
  push:
    tags:
      - 'v*'
      - '!*-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag, version, and ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi

          version="$(awk '/^[^[:space:]#]/{in_info=($1=="info:")} in_info && /^[[:space:]]+version:/{sub(/.*version:[[:space:]]*"/,""); sub(/".*/,""); print; exit}' build/config.yml)"
          if [ -z "$version" ] || [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match build/config.yml version ${version:-<missing>}" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Checked-out commit does not match $tag" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          pending_version="$(bash scripts/extract_pending_version.sh CHANGELOG.md)"
          test -n "$pending_version"
          if ! grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "Release version $version must have a dated CHANGELOG section" >&2
            exit 1
          fi
          bash scripts/extract_release_notes.sh "$version" CHANGELOG.md >/dev/null

  ci:
    name: Run release CI gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}

  build:
    name: Build verified release assets
    needs:
      - validate
      - ci
    uses: ./.github/workflows/release-assets.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      version: ${{ needs.validate.outputs.version }}
      retention_days: 7

  publish:
    name: Publish verified GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Download verified assets
        id: download_assets
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Wait before retrying asset download
        if: steps.download_assets.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-files
          sleep 5

      - name: Retry asset download
        if: steps.download_assets.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Validate assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "tunnelkit-$APP_VERSION-macos-universal.dmg"
            "tunnelkit-$APP_VERSION-macos-arm64.dmg"
            "tunnelkit-$APP_VERSION-macos-amd64.dmg"
            "tunnelkit-$APP_VERSION-windows-amd64-setup.exe"
            "tunnelkit-$APP_VERSION-windows-amd64.zip"
            "tunnelkit-$APP_VERSION-windows-arm64-setup.exe"
            "tunnelkit-$APP_VERSION-windows-arm64.zip"
            "tunnelkit-$APP_VERSION-linux-amd64.tar.gz"
            "tunnelkit-$APP_VERSION-linux-amd64.deb"
            "tunnelkit-$APP_VERSION-linux-amd64.rpm"
            "tunnelkit-$APP_VERSION-linux-arm64.tar.gz"
            "tunnelkit-$APP_VERSION-linux-arm64.deb"
            "tunnelkit-$APP_VERSION-linux-arm64.rpm"
          )
          for asset in "${expected[@]}"; do
            test -s "release-files/$asset"
          done
          actual_count="$(find release-files -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          [ "$actual_count" -eq "${#expected[@]}" ]
          (
            cd release-files
            sha256sum "${expected[@]}" > SHA256SUMS.txt
            test "$(wc -l < SHA256SUMS.txt | tr -d '[:space:]')" -eq "${#expected[@]}"
            sha256sum -c SHA256SUMS.txt
          )

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          release_notes_file="$RUNNER_TEMP/release-notes.md"
          bash scripts/render_release_notes.sh \
            --version "$APP_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" \
            --changelog CHANGELOG.md > "$release_notes_file"
          test -s "$release_notes_file"

      - name: Create draft, upload, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          release_notes_file="$RUNNER_TEMP/release-notes.md"
          test -s "$release_notes_file"

          if draft_state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft_state" != "true" ]; then
              echo "Release $tag already exists and is not a draft" >&2
              exit 1
            fi
            gh release edit "$tag" --notes-file "$release_notes_file"
          else
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --notes-file "$release_notes_file" \
              --title "TunnelKit $APP_VERSION"
          fi

          gh release upload "$tag" release-files/* --clobber

          draft_view="$(gh release view "$tag" --json assets,isDraft)"
          asset_count="$(jq -r '.assets | length' <<<"$draft_view")"
          if [ "$asset_count" -ne 14 ]; then
            echo "Draft release contains $asset_count assets; expected 14" >&2
            exit 1
          fi

          expected_names="$(cd release-files && printf '%s\n' * | sort)"
          actual_names="$(jq -r '.assets[].name' <<<"$draft_view" | sort)"
          if [ "$actual_names" != "$expected_names" ]; then
            echo "Draft release asset names do not match the verified local assets" >&2
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names") || true
            exit 1
          fi
          if ! jq -e '(.isDraft == true) and (.assets | all(.state == "uploaded"))' <<<"$draft_view" >/dev/null; then
            echo "Release must remain a verified draft with all 14 uploaded assets before publishing" >&2
            exit 1
          fi

          gh release edit "$tag" --draft=false --latest

          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "Release $tag was not published publicly" >&2
            exit 1
          fi

  cleanup-rolling:
    name: Remove superseded Rolling release
    needs:
      - validate
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: rolling-release-mutation
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Remove Rolling release and tag when superseded
        shell: bash
        run: |
          set -euo pipefail

          release_commit="$(git rev-parse HEAD)"
          git fetch origin --force --tags
          remote_tags="$(git ls-remote --refs --tags origin 'refs/tags/rolling' 'refs/tags/v*-pre' || true)"

          cleaned_orphan=false
          while IFS= read -r old_rel_tag; do
            [ -n "$old_rel_tag" ] || continue
            if ! awk -v ref="refs/tags/$old_rel_tag" '$2 == ref { found=1 } END { exit !found }' <<<"$remote_tags"; then
              gh release delete "$old_rel_tag" --yes
              echo "已删除无 tag 的 Rolling Release: $old_rel_tag"
              cleaned_orphan=true
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName == "rolling" or (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-pre$"))) | .tagName')

          if [ -z "$remote_tags" ]; then
            if [ "$cleaned_orphan" = false ]; then
              echo "Rolling 不存在，无需清理"
            fi
            exit 0
          fi

          while read -r remote_sha remote_ref; do
            [ -n "$remote_ref" ] || continue
            tag_name="${remote_ref#refs/tags/}"
            rolling_commit="$(git rev-parse "${remote_ref}^{commit}")"
            if [ "$tag_name" != "${GITHUB_REF_NAME}-pre" ] && ! git merge-base --is-ancestor "$rolling_commit" "$release_commit"; then
              echo "Rolling 指向正式版本之后的提交，保留: $tag_name"
              continue
            fi

            if gh release view "$tag_name" >/dev/null 2>&1; then
              gh release delete "$tag_name" --yes
            fi
            git push \
              --force-with-lease="$remote_ref:$remote_sha" \
              origin \
              ":$remote_ref"

            if gh release view "$tag_name" >/dev/null 2>&1; then
              echo "Rolling Release 删除后仍然存在: $tag_name" >&2
              exit 1
            fi
            if git ls-remote --exit-code --refs --tags origin "$remote_ref" >/dev/null 2>&1; then
              echo "rolling tag 删除后仍然存在: $tag_name" >&2
              exit 1
            fi
          done <<<"$remote_tags"

  notify-tap:
    name: Trigger maybk/homebrew-tap sync
    needs:
      - validate
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      TAP_REPO: maybk/homebrew-tap
      TAP_WORKFLOW: sync.yml
      TAP_REF: main
      TAP_APP: tunnelkit
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Detect tap dispatch authentication mode
        id: auth_mode
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.TAP_DISPATCH_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.TAP_DISPATCH_APP_PRIVATE_KEY }}
          PAT_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          APP_CLIENT_ID="$(printf '%s' "${APP_CLIENT_ID:-}" | tr -d '\r\n')"
          PAT_TOKEN="$(printf '%s' "${PAT_TOKEN:-}" | tr -d '\r\n')"
          if [ -n "$APP_CLIENT_ID" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$APP_CLIENT_ID" ] || [ -n "${APP_PRIVATE_KEY:-}" ]; then
              echo "::warning::Incomplete GitHub App configuration: both TAP_DISPATCH_APP_CLIENT_ID (variable) and TAP_DISPATCH_APP_PRIVATE_KEY (secret) are required."
            fi
            if [ -n "$PAT_TOKEN" ]; then
              echo "mode=pat" >> "$GITHUB_OUTPUT"
            else
              echo "mode=none" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Mint short-lived GitHub App dispatch token
        id: app_token
        if: steps.auth_mode.outputs.mode == 'app'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.TAP_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_DISPATCH_APP_PRIVATE_KEY }}
          owner: maybk
          repositories: homebrew-tap
          permission-actions: write

      - name: Dispatch tap sync workflow
        shell: bash
        env:
          AUTH_MODE: ${{ steps.auth_mode.outputs.mode }}
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          PAT_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = "none" ]; then
            msg="Skipping automatic ${TAP_REPO} sync: configure GitHub App (TAP_DISPATCH_APP_CLIENT_ID + TAP_DISPATCH_APP_PRIVATE_KEY) or Fine-grained PAT (TAP_DISPATCH_TOKEN with Actions: write only on ${TAP_REPO}). Manual fallback: gh workflow run ${TAP_WORKFLOW} -R ${TAP_REPO} --ref ${TAP_REF} -f app=${TAP_APP} -f expected_version=${APP_VERSION}"
            echo "::notice::${msg}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '### Homebrew Tap Sync\n\n- Status: skipped (no dispatch credentials configured)\n- Manual fallback: `gh workflow run %s -R %s --ref %s -f app=%s -f expected_version=%s`\n' \
                "$TAP_WORKFLOW" "$TAP_REPO" "$TAP_REF" "$TAP_APP" "$APP_VERSION" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          DISPATCH_TOKEN=""
          if [ "$AUTH_MODE" = "app" ]; then
            DISPATCH_TOKEN="${APP_TOKEN:-}"
          elif [ "$AUTH_MODE" = "pat" ]; then
            DISPATCH_TOKEN="${PAT_TOKEN:-}"
          else
            echo "::error::Unsupported tap dispatch auth mode: ${AUTH_MODE}"
            exit 1
          fi

          DISPATCH_TOKEN="$(printf '%s' "$DISPATCH_TOKEN" | tr -d '\r\n')"
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Auth mode '${AUTH_MODE}' selected but dispatch token is empty"
            exit 1
          fi
          if [[ "$DISPATCH_TOKEN" =~ [[:cntrl:]\"\\] ]]; then
            echo "::error::Dispatch token contains invalid control or quote characters"
            exit 1
          fi

          api_base="${GITHUB_API_URL:-https://api.github.com}"
          api_base="${api_base%/}"
          dispatch_url="${api_base}/repos/${TAP_REPO}/actions/workflows/${TAP_WORKFLOW}/dispatches"

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl_cfg="$tmp_dir/curl.cfg"
          payload_file="$tmp_dir/payload.json"
          resp_file="$tmp_dir/resp.json"

          umask 077
          cat > "$curl_cfg" <<EOF
          header = "Accept: application/vnd.github+json"
          header = "X-GitHub-Api-Version: 2022-11-28"
          header = "Content-Type: application/json"
          header = "Authorization: Bearer ${DISPATCH_TOKEN}"
          EOF
          umask 022

          jq -n \
            --arg ref "$TAP_REF" \
            --arg app "$TAP_APP" \
            --arg ver "$APP_VERSION" \
            '{ref: $ref, inputs: {app: $app, expected_version: $ver}, return_run_details: true}' > "$payload_file"

          retry_sleep="${TAP_DISPATCH_RETRY_SLEEP_SEC:-2}"
          attempt=1
          max_attempts=3
          status="000"
          while true; do
            : > "$resp_file"
            status="000"
            if status="$(curl -sS --connect-timeout 15 --max-time 30 -K "$curl_cfg" -X POST --data-binary "@$payload_file" -o "$resp_file" -w '%{http_code}' "$dispatch_url")"; then
              status="${status:-000}"
              if [ "$status" = "200" ] || [ "$status" = "204" ]; then
                run_url="$(jq -r '.html_url // empty' "$resp_file" 2>/dev/null || true)"
                if [ -n "$run_url" ]; then
                  echo "Dispatched ${TAP_REPO}/${TAP_WORKFLOW} (app=${TAP_APP}, expected_version=${APP_VERSION}, auth=${AUTH_MODE}): ${run_url}"
                else
                  echo "Dispatched ${TAP_REPO}/${TAP_WORKFLOW} (app=${TAP_APP}, expected_version=${APP_VERSION}, auth=${AUTH_MODE}, HTTP ${status})"
                fi
                if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                  {
                    printf '### Homebrew Tap Sync\n\n'
                    printf -- '- Target: `%s` (`%s` on `%s`)\n' "$TAP_REPO" "$TAP_WORKFLOW" "$TAP_REF"
                    printf -- '- App / Version: `%s` `v%s`\n' "$TAP_APP" "$APP_VERSION"
                    printf -- '- Auth mode: `%s`\n' "$AUTH_MODE"
                    if [ -n "$run_url" ]; then
                      printf -- '- Workflow Run: %s\n' "$run_url"
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"
                fi
                exit 0
              fi
              if [[ "$status" != "429" && "$status" != "500" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                break
              fi
            else
              status="${status:-000}"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              break
            fi
            sleep "$retry_sleep"
            if [[ "$retry_sleep" =~ ^[0-9]+$ ]]; then
              retry_sleep=$((retry_sleep * 2))
            fi
            attempt=$((attempt + 1))
          done

          status="${status:-000}"

          api_msg="$(jq -r '.message // empty' "$resp_file" 2>/dev/null || true)"
          case "$status" in
            401) hint="Credential rejected (401): check whether the GitHub App key or Fine-grained PAT has expired or been revoked." ;;
            403) hint="Permission denied (403): grant Actions: write (not Contents: write) on ${TAP_REPO}." ;;
            404) hint="Not found (404): verify the GitHub App or PAT is scoped to ${TAP_REPO} and ${TAP_WORKFLOW} exists on ${TAP_REF}." ;;
            422) hint="Unprocessable (422): verify ${TAP_WORKFLOW} is enabled on ${TAP_REF} and accepts inputs (app, expected_version)." ;;
            *) hint="Transient or unexpected failure (HTTP ${status}). Manual fallback: gh workflow run ${TAP_WORKFLOW} -R ${TAP_REPO} --ref ${TAP_REF} -f app=${TAP_APP} -f expected_version=${APP_VERSION}" ;;
          esac
          echo "::error::Failed to dispatch ${TAP_REPO}/${TAP_WORKFLOW} (HTTP ${status}${api_msg:+: ${api_msg}}). ${hint}"
          exit 1
