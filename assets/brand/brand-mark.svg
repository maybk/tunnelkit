<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>TunnelKit 纵深圆环隧道：透明品牌图形</title>
  <desc>TunnelKit 透明背景品牌图形母版，适用于 README、应用内品牌展示与宣发物料。</desc>

  <defs>
    <!-- 近景第一层大环（前实后柔） -->
    <linearGradient id="ring-outer" x1="56" y1="-40" x2="-290" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="0.35" stop-color="#2563EB"/>
      <stop offset="0.7" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>

    <!-- 中景第二层环 -->
    <linearGradient id="ring-mid" x1="152" y1="-35" x2="-136" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.38" stop-color="#3B82F6"/>
      <stop offset="0.72" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A5C8FF"/>
    </linearGradient>

    <!-- 远景第三层环 -->
    <linearGradient id="ring-inner" x1="236" y1="-30" x2="20" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.42" stop-color="#60A5FA"/>
      <stop offset="0.75" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>

    <!-- 贯穿三层圆环的极光翠绿加密数据流 -->
    <linearGradient id="emerald-stream" x1="-312" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="0.3" stop-color="#34D399"/>
      <stop offset="0.68" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- 3D 纵深圆环隧道主体 -->
  <g transform="translate(524 500) rotate(-42) scale(1.16)">
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M 128 -202 A 108 202 0 1 0 128 202 A 108 202 0 1 0 128 -202 Z
             M 120 -140 A 66 140 0 1 1 120 140 A 66 140 0 1 1 120 -140 Z"
          fill="url(#ring-inner)"/>

    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M 8 -254 A 136 254 0 1 0 8 254 A 136 254 0 1 0 8 -254 Z
             M 0 -184 A 86 184 0 1 1 0 184 A 86 184 0 1 1 0 -184 Z"
          fill="url(#ring-mid)"/>

    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M -118 -312 A 166 312 0 1 0 -118 312 A 166 312 0 1 0 -118 -312 Z
             M -126 -232 A 108 232 0 1 1 -126 232 A 108 232 0 1 1 -126 -232 Z"
          fill="url(#ring-outer)"/>

    <path d="M -256 -56
             L 248 -40
             A 40 40 0 1 1 248 40
             L -256 56
             A 56 56 0 0 1 -256 -56 Z"
          fill="url(#emerald-stream)"/>

    <path d="M 128 -202 A 108 202 0 0 1 128 202 L 120 140 A 66 140 0 0 0 120 -140 Z"
          fill="url(#ring-inner)"/>
    <path d="M 8 -254 A 136 254 0 0 1 8 254 L 0 184 A 86 184 0 0 0 0 -184 Z"
          fill="url(#ring-mid)"/>
    <path d="M -118 -312 A 166 312 0 0 1 -118 312 L -126 232 A 108 232 0 0 0 -126 -232 Z"
          fill="url(#ring-outer)"/>
  </g>
</svg>
