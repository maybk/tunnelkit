<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>TunnelKit 黄金圆规切线叠面盾：macOS 菜单栏模板图标</title>
  <desc>直接由 app-icon-light.svg 同比例转换的菜单栏模板图标，整体微缩为 81.25%（对应 64×64 中的 52×52），完整保留白边与三段丝带 Alpha 层次。</desc>

  <defs>
    <!-- 顶冠与右肩丝带灰度映射（中等半透 Alpha，与左翼及右下弧翼拉开清晰阶差） -->
    <linearGradient id="tk-cobalt-mask" x1="280" y1="136" x2="840" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#969696"/>
      <stop offset="0.45" stop-color="#767676"/>
      <stop offset="1" stop-color="#585858"/>
    </linearGradient>

    <!-- 左护翼灰度映射（中深镂空 Alpha，清晰呈现顶部 R=210 与左下 R=397 两道圆弧切线） -->
    <linearGradient id="tk-navy-mask" x1="184" y1="180" x2="480" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#484848"/>
      <stop offset="1" stop-color="#303030"/>
    </linearGradient>

    <!-- 下盾尖与右下角极光翠绿灰度映射（高对比深镂空，突出右下托举盾角与底尖） -->
    <linearGradient id="tk-emerald-mask" x1="284" y1="860" x2="840" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181818"/>
      <stop offset="0.5" stop-color="#0E0E0E"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>

    <clipPath id="tk-clip">
      <path fill-rule="evenodd" clip-rule="evenodd"
            d="M 284 188
               C 368 184 444 164 498 140
               Q 512 134 526 140
               C 580 164 656 184 740 188
               A 100 100 0 0 1 840 288
               L 840 436
               C 840 676 624 880 512 880
               C 400 880 184 676 184 436
               L 184 288
               A 100 100 0 0 1 284 188
               Z
               M 430 356
               A 38 38 0 0 0 392 394
               L 392 436
               C 392 556 460 652 512 652
               C 564 652 632 556 632 436
               L 632 394
               A 38 38 0 0 0 594 356
               C 560 352 536 340 512 324
               C 488 340 464 352 430 356
               Z"/>
    </clipPath>

    <!-- 100% 复用 app-icon-light.svg 的内部几何与白边比例 -->
    <mask id="app-icon-light-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#FFFFFF"/>
      <g clip-path="url(#tk-clip)">
        <rect x="160" y="120" width="704" height="780" fill="url(#tk-cobalt-mask)"/>
        <path d="M 326 136
                 A 210 210 0 0 0 512 324
                 L 512 652
                 L 284 760
                 L 160 760
                 L 160 136 Z"
              fill="url(#tk-navy-mask)"/>
        <path d="M 160 724
                 L 284 724
                 A 397 397 0 0 1 512 652
                 L 580 488
                 L 629 488
                 A 228 228 0 0 0 840 428
                 L 860 428
                 L 860 900
                 L 160 900 Z"
              fill="url(#tk-emerald-mask)"/>
      </g>
    </mask>
  </defs>

  <!-- 整体居中缩放至 81.25%（对应 64×64 中的 52×52） -->
  <g transform="translate(96 96) scale(0.8125)">
    <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#000000" mask="url(#app-icon-light-mask)"/>
  </g>
</svg>
