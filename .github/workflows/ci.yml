name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GTK4 and WebKitGTK 6.0 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libx11-dev

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --registry=https://registry.npmjs.org

      - name: Check frontend formatting and lint
        run: |
          npm --prefix frontend run format:check
          npm --prefix frontend run lint:check

      - name: Run frontend unit tests and build
        run: |
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build

      - name: Check Go formatting and static analysis
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:" >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run build and release contract tests
        run: |
          bash scripts/test_extract_pending_version.sh
          bash scripts/test_extract_release_notes.sh
          bash scripts/test_ci_config.sh
          bash scripts/test_rolling_release_config.sh
          git diff --check

  artifact-roundtrip:
    name: Verify artifact upload and download
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create artifact payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact-source"
          printf '%s\n' 'tunnelkit-ci-artifact-roundtrip' > "$RUNNER_TEMP/artifact-source/payload.txt"

      - name: Upload artifact payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-source/payload.txt
          if-no-files-found: error
          retention-days: 1

      - name: Download artifact payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-download

      - name: Verify artifact payload
        shell: bash
        run: >-
          cmp --silent
          "$RUNNER_TEMP/artifact-source/payload.txt"
          "$RUNNER_TEMP/artifact-download/payload.txt"
