name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Optional commit SHA to check out when called from another workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install Linux GTK4 and WebKitGTK 6.0 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libx11-dev

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Check frontend formatting and lint
        run: |
          pnpm --dir frontend run format:check
          pnpm --dir frontend run lint:check

      - name: Run frontend unit tests and build
        run: |
          pnpm --dir frontend run test -- --run
          pnpm --dir frontend run build

      - name: Check Go formatting and static analysis
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:" >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          for target in darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go vet \
              ./fortivpn/... \
              ./internal/api/... \
              ./internal/privilege/... \
              ./internal/ipc/... \
              ./internal/update/... \
              ./internal/credentials/... \
              ./internal/storage/... \
              ./internal/redact/... \
              ./internal/profile/... \
              ./internal/helper/... \
              ./internal/helperclient/... \
              ./internal/vpn/... \
              ./cmd/tunnelkit-helper
          done

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Run Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Run build and release contract tests
        run: |
          bash scripts/test_extract_pending_version.sh
          bash scripts/test_extract_release_notes.sh
          bash scripts/test_prepare_release.sh
          bash scripts/test_ci_config.sh
          bash scripts/test_rolling_release_config.sh
          git diff --check

  test-platform:
    name: Native Go race tests (${{ matrix.os }})
    if: github.workflow == 'CI'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run native Go analysis and race tests
        shell: bash
        run: |
          set -euo pipefail
          go vet ./fortivpn/... ./internal/... ./cmd/...
          go test -race ./fortivpn/... ./internal/... ./cmd/...

  artifact-upload:
    name: Upload CI artifact payload
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create artifact payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact-source"
          printf '%s\n' 'tunnelkit-ci-artifact-roundtrip' > "$RUNNER_TEMP/artifact-source/payload.txt"

      - name: Upload artifact payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-source/payload.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  artifact-roundtrip:
    name: Verify artifact upload and download
    needs: artifact-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download artifact payload
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-download

      - name: Wait before retrying artifact download
        if: steps.download.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/artifact-download"
          sleep 5

      - name: Retry artifact download
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-download

      - name: Verify artifact payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'tunnelkit-ci-artifact-roundtrip' > "$RUNNER_TEMP/expected.txt"
          cmp --silent "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/artifact-download/payload.txt"
